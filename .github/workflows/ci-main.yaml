name: Release - main

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: "8.0.x"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NewAPI/NewAPI.sln

      - name: Build
        run: dotnet build NewAPI/NewAPI.sln --configuration Release --no-restore

      - name: Publish API
        run: |
          dotnet publish NewAPI/NewAPI.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts/publish

      - name: Generate version
        run: |
          MINOR=$((GITHUB_RUN_NUMBER % 100))
          VERSION="1.${GITHUB_RUN_NUMBER}"
          FILE="MobyPark_API_version_${VERSION}.zip"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE_NAME=$FILE" >> $GITHUB_ENV

      - name: Create zip
        run: |
          cd artifacts/publish
          zip -r "../${PACKAGE_NAME}" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: MobyPark API v${{ env.VERSION }}
          files: artifacts/${{ env.PACKAGE_NAME }}
